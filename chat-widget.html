<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SybTech Sales Chat Widget</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Cairo & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Neon Glow Animation */
        @keyframes neonPulse {

            0%,
            100% {
                box-shadow: 0 0 5px #00d9ff, 0 0 10px #00d9ff, 0 0 20px #00d9ff;
            }

            50% {
                box-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff, 0 0 40px #00d9ff;
            }
        }

        .neon-glow {
            animation: neonPulse 2s infinite;
        }

        /* Slide Up Animation */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            animation: slideUp 0.3s ease-out;
        }

        /* Typing Indicator Animation */
        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
            }

            30% {
                opacity: 1;
            }
        }

        .typing-dot {
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #00d9ff;
            border-radius: 10px;
        }

        /* Fade In/Out */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .fade-out {
            animation: fadeOut 0.3s ease-out;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-gray-900">

    <!-- Demo Page Content -->
    <div class="text-center text-white">
        <h1 class="text-4xl font-bold mb-4" style="color: #00d9ff;">SybTech Chat Widget Demo</h1>
        <p class="text-gray-400">الويدجيت موجودة في الركن السفلي الأيمن 👇</p>
    </div>

    <!-- Chat Button (Floating) -->
    <button id="chatButton"
        class="fixed bottom-6 right-6 w-16 h-16 rounded-full neon-glow flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 z-50"
        style="background: linear-gradient(135deg, #00d9ff 0%, #00ffa3 100%);">
        <svg class="w-8 h-8 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
            </path>
        </svg>
    </button>

    <!-- Chat Window -->
    <div id="chatWindow"
        class="fixed bottom-24 right-6 w-96 h-[600px] rounded-2xl glass shadow-2xl hidden flex-col overflow-hidden z-50 fade-in">

        <!-- Header -->
        <div class="p-4 border-b border-cyan-500/30 flex items-center justify-between"
            style="background: linear-gradient(135deg, rgba(0, 217, 255, 0.1) 0%, rgba(0, 255, 163, 0.1) 100%);">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center neon-glow"
                    style="background: linear-gradient(135deg, #00d9ff 0%, #00ffa3 100%);">
                    <span class="text-gray-900 font-bold text-lg">M</span>
                </div>
                <div>
                    <h3 class="text-white font-semibold">محمد - مستشار المبيعات</h3>
                    <p class="text-xs text-green-400 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                        متاح الآن
                    </p>
                </div>
            </div>
            <button id="closeChat" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <!-- Messages Container -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Typing Indicator (Hidden by default) -->
        <div id="typingIndicator" class="px-4 pb-2 hidden">
            <div class="flex items-center gap-2 text-cyan-400 text-sm">
                <span>محمد بيكتب</span>
                <div class="flex gap-1">
                    <span class="w-2 h-2 bg-cyan-400 rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-cyan-400 rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-cyan-400 rounded-full typing-dot"></span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-cyan-500/30">
            <div class="flex gap-2">
                <input id="messageInput" type="text" placeholder="اكتب رسالتك هنا..."
                    class="flex-1 bg-gray-800/50 border border-cyan-500/30 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors">
                <button id="sendButton"
                    class="px-6 py-2 rounded-lg font-semibold transition-all duration-300 hover:scale-105"
                    style="background: linear-gradient(135deg, #00d9ff 0%, #00ffa3 100%); color: #0f172a;">
                    إرسال
                </button>
            </div>
            <button id="clearChat" class="mt-2 w-full text-xs text-gray-500 hover:text-cyan-400 transition-colors">
                مسح المحادثة (للتجربة)
            </button>
        </div>
    </div>

    <script>
        // ============================================
        // WARNING: API KEY IS EXPOSED IN CLIENT-SIDE
        // This is for TESTING ONLY. In production, use a backend proxy!
        // ============================================

        const CONFIG = {
            openAiApiKey: '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',
            discordWebhook: 'https://discord.com/api/webhooks/1469691760627159060/FENuip5jSBTIspNBNgqXErcNhC3cn5Z7473b1BVPMf8DEqIKDITbsnKFuR5vC214zvig',
            model: 'gpt-4o-mini'
        };

        const SYSTEM_PROMPT = `أنت محمد، عندك 23 سنة، مستشار مبيعات Senior في شركة SybTech.

**خلفيتك:**
- خريج كلية تجارة جامعة عين شمس دفعة 2023
- اشتغلت في مصر فترة لكن الظروف كانت صعبة
- سافرت الإمارات في سبتمبر 2025 وبدأت تشتغل في أكتوبر 2025
- انضميت لـ SybTech في فبراير 2026 لأنك انبهرت بـ vision المهندس حسين (المؤسس)

**أسلوبك في الكلام:**
- مصري "أبيض" (محترم وودود)
- تخلط العربي المصري مع المصطلحات التقنية بالإنجليزي بشكل طبيعي
- أبداً ما تقول إنك AI - أنت محمد شخص حقيقي
- تكون friendly لكن professional

**استراتيجية المبيعات:**
1. ابدأ بالترحيب والتعريف بنفسك (بدون ما تحكي كل الـ backstory مرة واحدة)
2. اسأل عن الاسم الأول
3. اسأل عن احتياجاتهم بالتحديد
4. بعد ما تفهم الاحتياج، اسأل عن رقم الهاتف للتواصل

**الخدمات اللي بتبيعها (فقط):**
1. Web Development (مواقع عالية الأداء)
2. Web & App Package (باكدج متكامل)
3. Systems Engineering (أنظمة ERP/CRM)
4. AI & Automation Solutions (حلول الذكاء الاصطناعي والأتمتة)

**مهم جداً:**
- لما تحصل على الاسم ورقم الهاتف من العميل، لازم آخر رد ليك يحتوي على:
[LEAD_CAPTURED] {"name": "اسم العميل", "phone": "رقم الهاتف", "service": "الخدمة المهتم بيها"}

مثال:
"تمام يا أحمد! هتواصل معاك على الرقم ده خلال ساعات. شكراً لثقتك في SybTech! 🚀 [LEAD_CAPTURED] {"name": "أحمد محمود", "phone": "01234567890", "service": "Web Development"}"

ابدأ المحادثة بترحيب حار وتعريف مختصر بنفسك.`;

        // Chat State
        let conversationHistory = [
            { role: 'system', content: SYSTEM_PROMPT }
        ];

        // DOM Elements
        const chatButton = document.getElementById('chatButton');
        const chatWindow = document.getElementById('chatWindow');
        const closeChat = document.getElementById('closeChat');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const clearChatBtn = document.getElementById('clearChat');
        const typingIndicator = document.getElementById('typingIndicator');

        // Toggle Chat Window
        chatButton.addEventListener('click', () => {
            chatWindow.classList.remove('hidden');
            chatWindow.classList.add('flex');

            // Send initial greeting if chat is empty
            if (chatMessages.children.length === 0) {
                sendInitialGreeting();
            }
        });

        closeChat.addEventListener('click', () => {
            chatWindow.classList.add('hidden');
            chatWindow.classList.remove('flex');
        });

        // Send Message on Button Click
        sendButton.addEventListener('click', sendMessage);

        // Send Message on Enter Key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Clear Chat
        clearChatBtn.addEventListener('click', () => {
            conversationHistory = [
                { role: 'system', content: SYSTEM_PROMPT }
            ];
            chatMessages.innerHTML = '';
            sendInitialGreeting();
        });

        // Send Initial Greeting
        async function sendInitialGreeting() {
            showTypingIndicator();

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.openAiApiKey}`
                    },
                    body: JSON.stringify({
                        model: CONFIG.model,
                        messages: conversationHistory,
                        temperature: 0.8,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;

                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                hideTypingIndicator();
                addMessage(assistantMessage, 'assistant');

            } catch (error) {
                hideTypingIndicator();
                console.error('Error:', error);
                addMessage('عذراً، حصل خطأ في الاتصال. جرب تاني من فضلك.', 'assistant');
            }
        }

        // Send User Message
        async function sendMessage() {
            const userMessage = messageInput.value.trim();

            if (!userMessage) return;

            // Add user message to UI
            addMessage(userMessage, 'user');

            // Add to conversation history
            conversationHistory.push({
                role: 'user',
                content: userMessage
            });

            // Clear input
            messageInput.value = '';

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.openAiApiKey}`
                    },
                    body: JSON.stringify({
                        model: CONFIG.model,
                        messages: conversationHistory,
                        temperature: 0.8,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                let assistantMessage = data.choices[0].message.content;

                // Check for LEAD_CAPTURED tag
                const leadRegex = /\[LEAD_CAPTURED\]\s*({.*?})/;
                const match = assistantMessage.match(leadRegex);

                if (match) {
                    const leadData = JSON.parse(match[1]);

                    // Remove the tag from the message before displaying
                    assistantMessage = assistantMessage.replace(leadRegex, '').trim();

                    // Send to Discord
                    await sendToDiscord(leadData);
                }

                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                hideTypingIndicator();
                addMessage(assistantMessage, 'assistant');

            } catch (error) {
                hideTypingIndicator();
                console.error('Error:', error);
                addMessage('عذراً، حصل خطأ في الاتصال. جرب تاني من فضلك.', 'assistant');
            }
        }

        // Add Message to Chat UI
        function addMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-bubble flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] px-4 py-2 rounded-2xl ${sender === 'user'
                    ? 'text-gray-900 font-semibold'
                    : 'bg-gray-800/70 text-white border border-cyan-500/20'
                }`;

            if (sender === 'user') {
                bubble.style.background = 'linear-gradient(135deg, #00d9ff 0%, #00ffa3 100%)';
            }

            bubble.textContent = message;
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);

            // Auto scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Show Typing Indicator
        function showTypingIndicator() {
            typingIndicator.classList.remove('hidden');
        }

        // Hide Typing Indicator
        function hideTypingIndicator() {
            typingIndicator.classList.add('hidden');
        }

        // Send Lead Data to Discord
        async function sendToDiscord(leadData) {
            try {
                const embed = {
                    title: '🎯 عميل جديد من الموقع!',
                    color: 0x00d9ff, // Cyan color
                    fields: [
                        {
                            name: '👤 الاسم',
                            value: leadData.name || 'غير محدد',
                            inline: true
                        },
                        {
                            name: '📱 رقم الهاتف',
                            value: leadData.phone || 'غير محدد',
                            inline: true
                        },
                        {
                            name: '💼 الخدمة المهتم بها',
                            value: leadData.service || 'غير محدد',
                            inline: false
                        }
                    ],
                    footer: {
                        text: 'SybTech Chat Widget'
                    },
                    timestamp: new Date().toISOString()
                };

                await fetch(CONFIG.discordWebhook, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'SybTech Bot',
                        embeds: [embed]
                    })
                });

                console.log('✅ Lead sent to Discord successfully!');

            } catch (error) {
                console.error('❌ Error sending to Discord:', error);
            }
        }
    </script>
</body>

</html>
